    activites: [a-livret-jeune]
    retenir: [c-interet-simple, c-capital-disponible]
    exercices: [e-placement-5-ans, e-ldd]
  - id: etape-2
    titre: Déterminer un taux périodique
    resume: Passer d'un taux annuel à un taux mensuel, par quinzaine ou journalier, pour un déblocage anticipé.
