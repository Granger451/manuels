objectif: >-
  Étudier des placements à intérêt simple et réinvestir les suites arithmétiques : capital disponible,
  valeur acquise, taux annuel, mensuel, par quinzaine ou journalier.
objectifs: objectifs

preparation_intro: Avant de commencer, une recommandation, un rappel de vocabulaire et trois exercices interactifs.
