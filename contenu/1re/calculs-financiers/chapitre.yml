  - titre: J'écris des pourcentages sous forme décimale
    lien: https://learningapps.org/display?v=pa9xstxd525
  - titre: Je calcule la quantité d'un pourcentage
    lien: https://learningapps.org/display?v=pfeodozc525

etapes:
  - id: etape-1
    titre: Calculer un capital à intérêt simple
